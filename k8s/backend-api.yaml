apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: banking-demo
  labels:
    app: backend-api
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
        tier: application
    spec:
      containers:
        - name: backend-api
          image: cloudbeesdemo/banking-demo-backend-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DATA_SERVICE_URL
              value: "http://data-service:5000"
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: banking-demo
spec:
  selector:
    app: backend-api
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
