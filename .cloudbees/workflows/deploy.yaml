# Per-component deploy workflow, called by the application's deployer.yaml
# during release orchestration (cross-repo `uses:` reference). Contract:
# accepts `artifact-id`, `artifact-url`, and `environment` inputs, deploys
# this component to the exact artifact version built, then registers the
# deployment in Unify for traceability.
#
# This is a native Unify workflow even though CI for this component runs
# in Jenkins - the Jenkinsfile registers the build artifact
# (registerBuildArtifactMetadata), and Unify's release/deploy stage is
# what actually ships it, regardless of which CI tool built it.
#
# Auth: uses a kubeconfig stored as the Unify secret KUBECONFIG (base64,
# decoded by cloudbees-days/setup-kubeconfig into $HOME/.kube/config),
# not a GCP service account - this cluster's own GCP IAM / Kubernetes RBAC
# don't allow self-service creation of new deploy credentials, so this
# kubeconfig was built from an already-authorized identity.
#
# Prerequisites (configured once in Unify, scoped to the target
# environment - Settings > Environments > Secrets/Variables):
#   - Secret KUBECONFIG: base64-encoded kubeconfig with access to this
#     component's Deployment in the target cluster/namespace.
#   - Var namespace: the target Kubernetes namespace (e.g. banking-demo).

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      artifact-url:
        type: string
        required: true
      environment:
        type: string
        required: true

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out
        uses: cloudbees-io/checkout@v1

      - name: Set kubeconfig
        uses: cloudbees-days/setup-kubeconfig
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy
        uses: docker://alpine/k8s:1.30.14
        shell: sh
        run: |
          kubectl set image deployment/backend-api backend-api=${{ inputs.artifact-url }} -n ${{ vars.namespace }}
          kubectl rollout status deployment/backend-api -n ${{ vars.namespace }} --timeout=120s

      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ inputs.artifact-id }}
